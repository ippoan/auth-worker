name = "auth-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "24b45709d060d957340180e995f0d373"
# version ごとの preview URL (<hash>-auth-worker.<subdomain>.workers.dev) を有効化。
# release-wave の no-traffic stage で upload した version へ、その専用 URL から
# 移動して検証できる。production traffic は custom route のままで workers_dev とは独立。
preview_urls = true

[vars]
AUTH_WORKER_ORIGIN = "https://auth.ippoan.org"
ALC_API_ORIGIN = "https://alc-api.ippoan.org"
ALC_API_STAGING_ORIGIN = "https://rust-alc-api-staging-566bls5vfq-an.a.run.app"
WORKER_ENV = "prod"
# e-Gov (Keycloak) OAuth — sbx (sandbox) endpoint; same on prod + staging since
# we only integrate with e-Gov's sbx environment.
EGOV_AUTH_BASE = "https://account2.sbx.e-gov.go.jp/auth"
EGOV_CLIENT_ID = "K26XGOmbDusxfKsp"
# Phase 2 multiplex (issue #169): JWT `aud` claim allowlist for the
# mcp-relay-bridge handler. Plain `[vars]` rather than a secret because the
# value is just public binary names (no credential content) — declaring it
# here makes the staging/prod allowlist auditable in source control and
# eliminates the per-environment `wrangler secret put` step. Default
# fallback in the handler is `["github-mcp-server-rs"]` (Phase 1 compat),
# extended here to also accept ref-files-mcp-server-rs.
MCP_JWT_AUDIENCE_ALLOWLIST = "github-mcp-server-rs,ref-files-mcp-server-rs"

# Refs ippoan/secrets-inventory#43: `/mcp/introspect` aud predicate が URL
# 形式の aud (RFC 8707 resource parameter で client が指定) を origin 一致で
# 受理する allowlist。`mcp(-staging).ippoan.org` は env から導出するので
# 不要。secrets-inventory 系の custom domain などをここに足す。
MCP_RESOURCE_ORIGINS_ALLOWLIST = "https://security-inventory.ippoan.org,https://security-rotate.ippoan.org,https://ref-files.ippoan.org,https://cf-access-mcp.ippoan.org"

[[kv_namespaces]]
binding = "AUTH_CONFIG"
id = "f13ecae4b69043819c09f606abb84797"

# ⚠️ MCP_OAUTH_KV は top-level (prod) には **意図的に bind しない**。
# これは欠落ではなく guardrail: prod `auth.ippoan.org/mcp/pair/grant-via-oat`
# を `MCP_OAUTH_KV not bound` (503) で無効化し、OAT→JWT mint を
# staging (`auth-staging.ippoan.org`) 経由に限定する設計。MCP スタックは
# staging を実運用として扱う (staging=prod)。staging には
# `[[env.staging.kv_namespaces]]` で bind 済み。
# 「prod に binding が無い＝欠落」と勘違いして AUTH_CONFIG と同様に
# 再追加しないこと。過去に誤って追加 → revert した経緯あり (Refs #241 / #242)。

# ─── INTERNAL_SHARED_SECRET (Secrets Store binding) ─────────────────────────
# `ref-files-worker` と同じ account-level Secrets Store entry を bind し、
# 両 worker が物理的に同一の値を見る。Rust binary (github-mcp-server-rs /
# ref-files-mcp-server-rs) は 1 つの埋め込み値で両 worker を introspect でき、
# 「auth と ref-files の secret 同期がズレる」事故が構造的に消える。
# Refs ippoan/ref-files-worker#4
#
# 2026-05-24: secret_name を `mcp-internal-shared-secret-{prod,staging}` の
# 2 entry 体制から **単一 `INTERNAL_SHARED_SECRET` entry** に統合
# (Refs ippoan/mcp-relay-rs#21、ippoan/mcp-relay-rs#27)。
# 統合理由:
#   - mcp-relay-rs binary は build-time 1 値しか embed できない (release.yml の
#     `secrets.INTERNAL_SHARED_SECRET` 経由)。同名 entry に揃えれば prod/staging
#     共通で同じ binary が使えて、CCoW silent bootstrap が両 env で動く。
#   - 両 entry の値同期が運用上必要だった (drift で 401 を起こした実害)。
#     entry を 1 個にすれば構造的に drift しない。
# 既存 entry `mcp-internal-shared-secret-{prod,staging}` は CF Secret Store
# に残置 (削除すると他 worker への影響不明)。今後の rotate は
# `INTERNAL_SHARED_SECRET` entry のみで行う。
#
# Bootstrap (初回のみ):
#   wrangler secrets-store secret create <store-id> \
#       --name INTERNAL_SHARED_SECRET --scopes workers --remote
# 以後 `wrangler deploy [--env staging]` で binding が再生する。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# MCP_JWT_SECRET (HS256 JWT 署名/検証鍵): 2026-05-25 (Refs ippoan/ref-files-worker#6)
# で Worker secret から Secrets Store binding に移行。`INTERNAL_SHARED_SECRET` entry
# を point することで ref-files-worker と同じ HS256 鍵を物理共有 — worker 間で
# 鍵 drift する事故 (= ref-files-worker#6 smoke で発見) を構造的に潰す。
#
# 移行手順 (admin が deploy 前に 1 回だけ):
#   wrangler secret delete MCP_JWT_SECRET                  # prod
#   wrangler secret delete MCP_JWT_SECRET --env staging    # staging
# (binding 名と Worker secret 名が衝突するため事前削除が必要。binding 経由は
#  `wrangler deploy` 後に自動 hydrate される。)
[[secrets_store_secrets]]
binding = "MCP_JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# 2026-05-25 (Refs #204): `.dev.vars` 由来の prod secret 一式を Workers secret
# (`wrangler secret put`) から CF Secrets Store binding に移行。secret-verify-gcp.yml
# が secret_name を auto-extract → GCP backup を CI で検証してくれる効果も入る。
# 値は MCP create_secret 経由で `.dev.vars` の prod 値を CF Secrets Store + GCP に
# 投入済 (新 version)。
# OAUTH_STATE_SECRET / SSO_ENCRYPTION_KEY / EGOV_CLIENT_SECRET / SESSION_COOKIE_SECRET /
# TENANT_ACL / USER_ACL / APP_TENANT_ACL は `.dev.vars` の値が placeholder or
# 未掲載のため別 PR で対応。
[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_ID"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GOOGLE_CLIENT_ID"

[[secrets_store_secrets]]
binding = "GOOGLE_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GOOGLE_CLIENT_SECRET"

# JWT_SECRET: rust-alc-api と HS256 鍵共有 (= verifies /top cookie + signs internal JWT)。
# hcreader-worker (ippoan/HealthConnectReaderWorker) も同 entry を bind して cookie
# verify に流用する設計 (Refs HealthConnectReaderWorker#15)。
[[secrets_store_secrets]]
binding = "JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "JWT_SECRET"

# rust-alc-api#434 step 3 (方式 B): run.invoker SA key。`/alc-proxy/*` が Google
# OIDC ID token を mint して Cloud Run IAM lockdown 後の rust-alc-api に到達する。
# SA key は auth-worker のみに bind (consumer には配らない = blast radius 最小)。
[[secrets_store_secrets]]
binding = "ALC_API_PROXY_SA_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "ALC_API_PROXY_SA_KEY"

[[secrets_store_secrets]]
binding = "GITHUB_MCP_CLIENT_ID"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GITHUB_MCP_CLIENT_ID"

[[secrets_store_secrets]]
binding = "GITHUB_MCP_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GITHUB_MCP_CLIENT_SECRET"

[[secrets_store_secrets]]
binding = "GITHUB_MCP_USER_ALLOWLIST"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GITHUB_MCP_USER_ALLOWLIST"

[[secrets_store_secrets]]
binding = "GITHUB_WEBHOOK_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GITHUB_WEBHOOK_SECRET"

# JWT_FOR_CI_DASHBOARD: ci-dashboard 用 OAuth Code + PKCE 経由の `INTERNAL_SHARED_SECRET*`
# として bind (#189 multi-binding 規約)。staging は既に同名で bind 済、本 PR で prod にも
# 同じ binding を追加。これにより `[secrets.required]` から外せる (= 完全 binding 経由)。
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET_CI_DASHBOARD"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "JWT_FOR_CI_DASHBOARD"

# rust-alc-api#434 Phase 2/3: GCP source-of-truth から sync した secret を bind。
# rust の cloudrun/render.sh が同名 GCP secret を使うので、CF 側も同一値 = parity 担保。
# SSO_ENCRYPTION_KEY は MCP github-token 暗号化 + LINE WORKS client_secret 復号で共用。
[[secrets_store_secrets]]
binding = "SSO_ENCRYPTION_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "sso-encryption-key"

[[secrets_store_secrets]]
binding = "LINE_LOGIN_CHANNEL_ID"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "line-login-channel-id"

[[secrets_store_secrets]]
binding = "LINE_LOGIN_CHANNEL_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "line-login-channel-secret"

# LINE WORKS webhook 受信用 Durable Object (bot_id ごとに 1 instance)
[[durable_objects.bindings]]
name = "LINEWORKS_WEBHOOK_DO"
class_name = "LineworksWebhookDO"

# MCP relay 用 Durable Object (github_login ごとに 1 instance, hibernatable WS)
# Phase 6: routes + DO skeleton のみ。Phase 7 で frame 変換を実装する。
[[durable_objects.bindings]]
name = "MCP_SESSION_DO"
class_name = "McpSession"

# ADR-004 (cc-relay) — multiplex 修正版: 専用 DO は作らず、既存 McpSession
# DO に /__push_event を追加して webhook を broadcast する。
# (旧 IssueRoomDO は v3 migration で導入したが、本 PR で機能ごと撤去。
#  Cloudflare の DO 削除は `deleted_classes` migration で行う。)

[[migrations]]
tag = "v1-lineworks-webhook"
new_sqlite_classes = ["LineworksWebhookDO"]

[[migrations]]
tag = "v2-mcp-session"
new_sqlite_classes = ["McpSession"]

[[migrations]]
tag = "v3-issue-room"
new_sqlite_classes = ["IssueRoomDO"]

[[migrations]]
tag = "v4-remove-issue-room"
deleted_classes = ["IssueRoomDO"]

[observability]
enabled = true
head_sampling_rate = 1

# `secrets.required` は ci-workflows/secret-verify-gcp.yml の入力。GCP
# Secret Manager 上に **これらと完全に同名の secret が存在することを CI で
# 検証**する。verify SA に `secretmanager.secrets.update` 権限があれば
# `used-by-ippoan-auth-worker=active` label が自動付与される。
#
# 2026-05-24 (ippoan/ci-workflows#58 以降): `[[secrets_store_secrets]]`
# bindings の `secret_name` は `secret-verify-gcp.yml` が **自動抽出** して
# verify 対象に加える (top-level + `[env.*]` 配下 nested 共に走査)。本リスト
# に重複宣言する必要は無く、また宣言すると wrangler 4.79+ の binding
# 名前空間 collision で `wrangler types` が fail する (= 本リストには
# `[[secrets_store_secrets]]` 系の secret_name を書かない)。
#
# 結果として本リストには **`[[secrets_store_secrets]]` で bind していない
# 純粋 GCP-only secret** だけが残る。2026-05-25 (Refs #204) で `.dev.vars`
# 由来の prod secret 一式を Secrets Store binding に移行したので本リストは空。
# `JWT_FOR_CI_DASHBOARD` も `INTERNAL_SHARED_SECRET_CI_DASHBOARD` binding 経由で
# auto-extract されるためここからは外す。
[secrets]
required = []

[[routes]]
pattern = "auth.ippoan.org"
custom_domain = true

# MCP relay endpoint — github-mcp-server-rs 用 outbound WebSocket relay
# (issue #117 / Phase 6). cloudflared Quick Tunnel の置き換え。
[[routes]]
pattern = "mcp.ippoan.org"
custom_domain = true

# Secrets (set via `wrangler secret put` — prod / staging とも同名):
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# OAUTH_STATE_SECRET
# JWT_SECRET           (HS256 secret shared with rust-alc-api; verifies /top cookie + signs internal JWT)
# EGOV_CLIENT_SECRET   (e-Gov sbx softwareID K26XGOmbDusxfKsp 用の client_secret)
# SSO_ENCRYPTION_KEY   (LINE WORKS bot_secret_encrypted 復号用、rust-alc-api と同値)
# TENANT_ACL           (JSON: {"<github-org>": ["<tenant-id>", ...]}; gates per-org access)
# USER_ACL             (JSON: {"<github-org>": ["email@example.com", ...]}; OR-composed with TENANT_ACL)
# APP_TENANT_ACL       (JSON: {"bypass_emails":[...], "apps":{"<origin>":["<tenant>"|"*",...]}};
#                       bypass_emails is a global dev-bypass list (typically staging only);
#                       apps partitions tenants per redirect-origin within the same org;
#                       opt-in: origins not in apps pass; fail-open on parse error)
# GITHUB_MCP_CLIENT_ID       (MCP OAuth Provider 用 GitHub OAuth App の Client ID; staging/prod 別 App.
#                             staging = "ippoan MCP (staging)" / prod = "ippoan MCP (production)" 想定。
#                             どちらも ippoan org 所有 OAuth App, scope は read:user + repo)
# GITHUB_MCP_CLIENT_SECRET   (同上 Secret)
# MCP_JWT_SECRET             (HS256 secret for MCP access tokens (JWT); 既存 JWT_SECRET と別管理)
# SESSION_COOKIE_SECRET      (issue #144: 1-click pair flow の `mcp_pair_session` cookie 署名鍵。
#                             MCP_JWT_SECRET と分けるのは pair session 漏洩を device-flow JWT から
#                             隔離するため。**未設定だと /mcp/pair/* が 503 を返す** ので
#                             github-mcp-server-rs#42 の 1-click pair flow が完全に止まる。
#                             prod / staging で別値を発行する:
#                               openssl rand -hex 32 | wrangler secret put SESSION_COOKIE_SECRET                  # prod (top-level config)
#                               openssl rand -hex 32 | wrangler secret put SESSION_COOKIE_SECRET --env staging    # staging
#                             ※ この repo の wrangler.toml は top-level = prod、`[env.staging]` のみ override。
#                                `--env production` block は存在しないので `--env=production` は error になる)
# INTERNAL_SHARED_SECRET は **Secrets Store binding** に移行済 — top-level の
#   [[secrets_store_secrets]] / `[[env.staging.secrets_store_secrets]]` を参照。
#   `wrangler secret put INTERNAL_SHARED_SECRET ...` は使わない (二重管理になる)。
# GITHUB_MCP_USER_ALLOWLIST  (JSON array of github logins, e.g. ["yhonda-ohishi"]; fail-closed)
# GITHUB_WEBHOOK_SECRET      (ADR-004: HMAC-SHA256 shared secret for `POST /webhooks/github`.
#                             public issue 前提なので authn ではなく spam 対策、全 repo 共通値)
#
# Allowlist (managed via `wrangler kv key put --remote --namespace-id=f13ecae4b69043819c09f606abb84797 <key>`):
#   origins:prod    - production frontends
#   origins:staging - staging frontends
#   origins:dev     - dev-proxy frontends (*-dev.ippoan.org)

[env.staging]
name = "auth-worker-staging"
workers_dev = true

[[env.staging.routes]]
pattern = "auth-staging.ippoan.org"
custom_domain = true

# MCP relay (staging) — github-mcp-server-rs 用 outbound WebSocket relay
[[env.staging.routes]]
pattern = "mcp-staging.ippoan.org"
custom_domain = true

[env.staging.vars]
AUTH_WORKER_ORIGIN = "https://auth-staging.ippoan.org"
ALC_API_ORIGIN = "https://rust-alc-api-staging-566bls5vfq-an.a.run.app"
ALC_API_STAGING_ORIGIN = "https://rust-alc-api-staging-566bls5vfq-an.a.run.app"
WORKER_ENV = "staging"
# #434 Phase D step 1: internal call (/alc-internal-proxy 等) の認証 token を
# HS256 共有 JWT → Google OIDC ID token (aud=alc-api-internal) に切替える。
# ALC_API_PROXY_SA_KEY (env.staging binding) で mint する。rust 側は
# INTERNAL_AUTH_TRUST_OIDC=1 で dual-accept 済みなので無停止。prod top-level
# [vars] には lockdown 本flip まで入れない。
INTERNAL_AUTH_OIDC = "1"
# admin proxy 等の網羅ログ (verify 結果 / 注入 claims / rust 応答) を有効化。
# staging 専用 (prod top-level [vars] には入れない、Refs rust-alc-api#434 admin 401 調査)。
DEBUG = "true"
EGOV_AUTH_BASE = "https://account2.sbx.e-gov.go.jp/auth"
EGOV_CLIENT_ID = "K26XGOmbDusxfKsp"
# See top-level [vars] for rationale. Same value on staging + prod per
# `src/handlers/mcp-relay-bridge.ts` header comment (Phase 2 design).
MCP_JWT_AUDIENCE_ALLOWLIST = "github-mcp-server-rs,ref-files-mcp-server-rs"
# Refs ippoan/secrets-inventory#43: URL aud origin allowlist (staging 用)。
# staging custom domain 配下も足したいが、secrets-inventory は prod URL の
# まま staging deploy しているため同じ entry を流用する。
# cdp-relay は AUTH_WORKER_ORIGIN を auth-staging に向けているので staging 側にだけ
# 足す (= prod top-level [vars] には入れない。Refs ippoan/mcp-cf-workers#28)。
MCP_RESOURCE_ORIGINS_ALLOWLIST = "https://security-inventory.ippoan.org,https://security-rotate.ippoan.org,https://ref-files.ippoan.org,https://cf-access-mcp.ippoan.org,https://cdp-relay.ippoan.org"
# hcreader-worker origin — `/oauth/ghapi/callback` から refresh_token を
# 内部 POST する宛先 (`${HCREADER_WORKER_ORIGIN}/api/ghapi/store-tokens`)。
# hcreader-worker は single-env (staging = prod = hcreader.ippoan.org)。
# Refs ippoan/HealthConnectReaderWorker#60, #61
HCREADER_WORKER_ORIGIN = "https://hcreader.ippoan.org"

[[env.staging.kv_namespaces]]
binding = "AUTH_CONFIG"
id = "f13ecae4b69043819c09f606abb84797"

# MCP OAuth Provider 用 — device_codes / sessions / refresh tokens を保持
[[env.staging.kv_namespaces]]
binding = "MCP_OAUTH_KV"
id = "0498e6057b8c4d7fbca92e9de41524ee"

# ref-files-worker と同じ store_id + secret_name を point させて値を物理共有
# (top-level コメント参照)。2026-05-24 以降 prod/staging とも同一 entry
# `INTERNAL_SHARED_SECRET` に統合済 (Refs ippoan/mcp-relay-rs#21)。
[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# MCP_JWT_SECRET (HS256): top-level コメント参照。Refs ippoan/ref-files-worker#6 で
# ref-files-worker と HS256 鍵を物理共有するため `INTERNAL_SHARED_SECRET` entry に bind。
[[env.staging.secrets_store_secrets]]
binding = "MCP_JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# ci-dashboard 専用 secret。OAuth Code + PKCE consumer (`@ippoan/auth-client-worker`
# 経由) なので MCP 系 secret (`mcp-internal-shared-secret-*`) は使わず、ci-dashboard
# 向けに分けた `JWT_FOR_CI_DASHBOARD` entry を bind する。binding 名が
# `INTERNAL_SHARED_SECRET*` で始まる必要があるのは `resolveAllSharedSecrets` (#189/#190)
# の発見規約のため。Secrets Store entry は operator が事前作成済 (Cloudflare dashboard
# Storage & databases → Secrets Store → `JWT_FOR_CI_DASHBOARD`)。
[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET_CI_DASHBOARD"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "JWT_FOR_CI_DASHBOARD"

# 2026-05-25 (Refs #204): `.dev.vars` 由来 prod secret 一式の Secrets Store 移行。
# top-level (= prod) と同 binding を staging にも生やして両 env で同 entry を共有。
[[env.staging.secrets_store_secrets]]
binding = "GOOGLE_CLIENT_ID"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GOOGLE_CLIENT_ID"

[[env.staging.secrets_store_secrets]]
binding = "GOOGLE_CLIENT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "GOOGLE_CLIENT_SECRET"

[[env.staging.secrets_store_secrets]]
binding = "JWT_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "JWT_SECRET"

# Bot Config Import (developer 専用) が staging の /api/staging/import を叩く際の
# X-Staging-Key (rust-alc-api#391)。GCP ALC_STAGING_API_KEY から sync 済み。staging 専用。
[[env.staging.secrets_store_secrets]]
binding = "ALC_STAGING_API_KEY"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "ALC_STAGING_API_KEY"

# rust-alc-api#434 step 3 (方式 B): run.invoker SA key (staging。3a で staging の
# backend/gateway に run.invoker 付与 + ALC_API_PROXY_SA_KEY を GCP/CF 投入済み)。
