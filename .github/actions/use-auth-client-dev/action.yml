name: 'Use auth-client dev'
description: 'Overlay @ippoan/auth-client@dev for staging (PR / branch push); skip on v* tag so prod uses the pinned stable version'
inputs:
  working-directory:
    description: 'npm project directory'
    required: false
    default: '.'
  github-token:
    description: 'GitHub token for packages read'
    required: true
runs:
  using: 'composite'
  steps:
    # staging チャネル = dev / prod (v* tag) = package.json の stable pin、という
    # 二系統運用 (Refs rust-alc-api#434)。tag push 以外 (= PR / main 等の branch
    # push、いずれも staging 文脈) では @dev を overlay install して staging を
    # bleeding-edge dev チャネルで検証する。v* tag push (= prod deploy) では
    # overlay せず package.json の `^x.y.z` 固定版 (= 直近 release tag) を使う。
    # 旧条件は `pull_request` のみだったため main push の検証が古い dev (npm#7562)
    # で typecheck 赤になっていた (= これを解消)。
    - name: Install auth-client@dev
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm install @ippoan/auth-client@dev
      env:
        NODE_AUTH_TOKEN: ${{ inputs.github-token }}
