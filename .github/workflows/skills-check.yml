name: skills-check

# auth-worker-map skill が構造変化に追従しているかを PR diff で検査する
# (ci-workflows#118 / claude-skills#59 Wave 2)。enforce=warn (default)。
# 同時に新規依存 vs knowledge/standards/libs の dependency-check も走る。

on:
  pull_request:
    # ready_for_review を含めるのは test.yml と同じ理由 (draft 解除で再実行させる)。
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  skills-check:
    uses: ippoan/ci-workflows/.github/workflows/skills-check.yml@main
    # with:
    #   enforce: warn        # warn (default) | fail
