name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      install_command: 'npm install'
      has_integration: true
      typecheck_command: 'npx tsc --noEmit && npx tsc -p test/tsconfig.json --noEmit'
      post_install_script: |
        npx wrangler types
        bash scripts/export-ts-bindings.sh src/types
      deploy_staging_script: 'npx wrangler deploy --env staging --var VERSION:${{ github.sha }}'
      # release は frontend-ci の release_no_traffic=true (default) により
      # `wrangler deploy` が `wrangler versions upload` (no-traffic) に置換される。
      # flip は CF ダッシュボード / `wrangler versions deploy <id>@100%` で行う。
      deploy_release_script: 'npx wrangler deploy --var VERSION:${{ github.ref_name }}'
      npm_scope: '@ippoan'
      # comma-separated multi-publish (ippoan/ci-workflows#48): auth-client は
      # Nuxt frontend 向け、auth-client-worker は Cloudflare Worker consumer 向け。
      # 両 package を 1 回の CI で publish — dev tag は `0.0.<PR>-dev.<SHA>`、
      # release tag は `v0.2.3` などのキャプチャ済み tag を全 package 共通で適用。
      npm_publish_directory: 'packages/auth-client,packages/auth-client-worker'
      # Release Wave compatibility (Refs ippoan/ci-dashboard#157):
      # auth-worker は integration test で rust-alc-api を backend として叩く
      # consumer。docker-compose.test.yml の API_IMAGE を現 production SHA に
      # 差し替えて test し (truthful 突合)、結果を ci-dashboard に記録する。
      # これで Compatibility グラフに auth-worker → rust-alc-api edge が載る。
      compat_backend_repo: 'ippoan/rust-alc-api'
      compat_backend_image_env: 'API_IMAGE'
    secrets: inherit

  # cross-repo symbol index: main push 時に symbol を抽出し ci-dashboard の D1 に
  # 投入する (初回フル → 以後 git 差分)。鮮度比較 / 横断 query の source。
  # ctags ベースなので依存ビルド不要 = test と独立に並列実行。
  # 設計: ippoan/claude-skills の cross-repo-symbol-index skill。
  symbol-index:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ippoan/ci-workflows/.github/workflows/symbol-index.yml@main
    secrets:
      ingest_secret: ${{ secrets.SYMBOL_INDEX_INGEST_SECRET }}
