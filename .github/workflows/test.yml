name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  ci:
    uses: ippoan/ci-workflows/.github/workflows/frontend-ci.yml@main
    with:
      install_command: 'npm install'
      has_integration: true
      typecheck_command: 'npx tsc --noEmit && npx tsc -p test/tsconfig.json --noEmit'
      post_install_script: |
        npx wrangler types
        bash scripts/export-ts-bindings.sh src/types
      deploy_staging_script: 'npx wrangler deploy --env staging --var VERSION:${{ github.sha }}'
      # release は frontend-ci の release_no_traffic=true (default) により
      # `wrangler deploy` が `wrangler versions upload` (no-traffic) に置換される。
      # flip は CF ダッシュボード / `wrangler versions deploy <id>@100%` で行う。
      deploy_release_script: 'npx wrangler deploy --var VERSION:${{ github.ref_name }}'
      npm_scope: '@ippoan'
      # comma-separated multi-publish (ippoan/ci-workflows#48): auth-client は
      # Nuxt frontend 向け、auth-client-worker は Cloudflare Worker consumer 向け。
      # 両 package を 1 回の CI で publish — dev tag は `0.0.<PR>-dev.<SHA>`、
      # release tag は `v0.2.3` などのキャプチャ済み tag を全 package 共通で適用。
      npm_publish_directory: 'packages/auth-client,packages/auth-client-worker,packages/test-utils'
      # auth-client の publish 後、全 consumer に bump PR を自動作成する
      # (frontend-ci の propagate job → propagate-package.yml)。手動 bump を廃す。
      # dirs は repos と同順 (alc-app のみ web/、他は repo root)。cross-org
      # (ohishi-exp) 分は PROPAGATE_PAT がその org に repo scope を持つ必要あり。
      npm_publish_name: '@ippoan/auth-client'
      npm_publish_propagate_repos: 'ippoan/nuxt-pwa-carins,ippoan/nuxt-items,ohishi-exp/nuxt_dtako_logs,ohishi-exp/nuxt-ichibanboshi,ohishi-exp/nuxt-ichibanboshi-seikyu,ohishi-exp/nuxt-dtako-admin,ippoan/nuxt-trouble,ippoan/nuxt-notify,ippoan/alc-app'
      npm_publish_propagate_dirs: '.,.,.,.,.,.,.,.,web'
      # Release Wave compatibility (Refs ippoan/ci-dashboard#157):
      # auth-worker は integration test で rust-alc-api を backend として叩く
      # consumer。docker-compose.test.yml の API_IMAGE を現 production SHA に
      # 差し替えて test し (truthful 突合)、結果を ci-dashboard に記録する。
      # これで Compatibility グラフに auth-worker → rust-alc-api edge が載る。
      compat_backend_repo: 'ippoan/rust-alc-api'
      compat_backend_image_env: 'API_IMAGE'
    secrets: inherit

  # PR run: staging deploy 直後に、CF Secrets Store binding 経由で auth-worker が
  # 実際に解決した INTERNAL_SHARED_SECRET と GCP Secret Manager の値が一致するかを
  # 突き合わせる (= cross-store drift の自動検出)。詳細は
  # ippoan/auth-worker#274 / ippoan/email-receiver#1。
  # PR でしか走らない (= tag push の release deploy は対象外)。
  # NOTE: reusable 側の EXPECTED env-var 配置バグ (KeyError) は
  # ippoan/ci-workflows#140 で修正済み (それ以前は全 PR で必ず fail していた)。
  drift-check-staging:
    needs: [ci]
    if: github.event_name == 'pull_request'
    uses: ippoan/ci-workflows/.github/workflows/drift-check.yml@main
    permissions:
      id-token: write
      contents: read
    with:
      consumer_url: 'https://auth-worker-staging.m-tama-ramu.workers.dev/health/secret-fingerprint'
      secret_name: 'INTERNAL_SHARED_SECRET'
      gcp_project: 'cloudsql-sv'
      gcp_wif_provider: ${{ vars.GCP_WIF_PROVIDER }}
      gcp_wif_service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT_STAGING }}
